{% extends "base.html" %}

{% block content %}
    <div class="row">
        <div class="column">
            {% for post in posts %}
                <div class="post">
                    <div class="date">{{ post.time_published }}</div>
                    <h1>
                        <a href="#" class="text-decoration-none">{{ post.blog_title }}</a>
                    </h1>
                    <div class="author">Author: {{ post.author.username }}</div>
                    <p>
                        {{ post.blog_post|truncatechars:300 }}
                        <a href="#">Read more</a>
                    </p>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
